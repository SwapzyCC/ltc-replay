# TLS termination for the relay's own HTTP API.
#
# Install to /etc/nginx/conf.d/replay.conf. See docs/tls-endpoints.md.
#
# The relay binds 127.0.0.1:28350 and its only authentication is the bearer
# token in AUTH_TOKEN. That token is enough to read the deposit history of
# every watched address, and over plain HTTP it is sent on every request in
# the clear. If the API crosses anything public, it crosses it under TLS.

limit_req_zone $binary_remote_addr zone=replay:10m rate=30r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name replay.example.dev;

    ssl_certificate     /etc/letsencrypt/live/replay.example.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replay.example.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:REPLAY:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The consumer is your own backend, at a known address. Pin it.
    # allow 203.0.113.10;
    # deny  all;

    # Unauthenticated by design, so the health check needs no secret. It
    # reports the process, not the chain.
    location = /health {
        proxy_pass http://127.0.0.1:28350;
        access_log off;
    }

    location / {
        limit_req zone=replay burst=60 nodelay;

        proxy_pass http://127.0.0.1:28350;
        proxy_http_version 1.1;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host          $host;
        proxy_set_header X-Real-IP     $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /v1/replay streams a range of blocks and can run for minutes on a
        # large gap — which is exactly when it matters most. A 60-second
        # default cuts it off mid-stream and the consumer sees a truncated
        # body, not an error.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Streaming responses must not be buffered, or the consumer waits for
        # the whole range before seeing the first block.
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/replay-api.log;
    error_log  /var/log/nginx/replay-api-error.log warn;
}

# Redirect plain HTTP, and leave the ACME challenge path reachable so certbot
# can renew without the redirect swallowing its request.
server {
    listen 80;
    listen [::]:80;
    server_name replay.example.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
