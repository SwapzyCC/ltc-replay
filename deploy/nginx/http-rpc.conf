# TLS termination for Litecoin Core's JSON-RPC.
#
# Install to /etc/nginx/conf.d/rpc.conf (this one IS an http-level config,
# unlike stream-zmq.conf). See docs/tls-endpoints.md.
#
# Core's RPC speaks HTTP with Basic auth and no TLS of its own. Exposing it
# directly means the credentials cross the network in base64, which is to say
# in the clear. This terminates TLS in front of it and forwards to loopback.
#
# The credentials are still Core's — nginx passes the Authorization header
# through untouched and adds no authentication of its own. Everything below is
# about limiting what an attacker who has the password can reach, and how fast
# an attacker who does not can guess.

# Rate limit keyed on client address. Core answers RPC from a small fixed
# thread pool, so a flood does not just fail — it starves the relay's own
# catch-up queries, which is the failure that actually costs you.
limit_req_zone $binary_remote_addr zone=ltcrpc:10m rate=20r/s;

server {
    listen 9332 ssl;
    listen [::]:9332 ssl;
    server_name rpc.example.dev;

    ssl_certificate     /etc/letsencrypt/live/rpc.example.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.example.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:RPC:10m;
    ssl_session_timeout 1h;

    # Nothing here is meant for a browser, but a stray HTML error page from
    # somewhere else in the config should not be framable either.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # If the set of callers is known, say so. This is worth more than every
    # other line in the file.
    # allow 203.0.113.10;
    # deny  all;

    location / {
        limit_req zone=ltcrpc burst=40 nodelay;

        proxy_pass http://127.0.0.1:9332;
        proxy_http_version 1.1;

        # Pass Core's Basic auth through untouched. nginx must not invent or
        # strip an Authorization header here.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host          $host;
        proxy_set_header X-Real-IP     $remote_addr;

        # getblock at verbosity 2 on a full block is large and slow. The
        # defaults (60s) will truncate it mid-response, which surfaces as a
        # JSON parse error rather than a timeout.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 10s;

        # RPC responses are JSON of unbounded size. Buffering the whole thing
        # to disk before forwarding adds latency for no benefit.
        proxy_buffering off;

        # Requests are small; this only needs to be big enough for a batch.
        client_max_body_size 2m;
    }

    # A wallet endpoint exists only if the node loads wallets. Left open on
    # purpose — the relay itself calls no wallet methods, and blocking the path
    # would break a co-tenant that does.

    access_log /var/log/nginx/ltc-rpc.log;
    error_log  /var/log/nginx/ltc-rpc-error.log warn;
}
