# TLS termination for Litecoin Core's ZMQ publishers.
#
# Install to /etc/nginx/stream.d/zmq.conf and see docs/tls-endpoints.md for the
# nginx.conf change that makes that directory load at all — the `stream` block
# is NOT inside `http`, and most distro configs include only `http` snippets.
# A file dropped into conf.d/ instead is silently ignored, or breaks the whole
# config with "server directive is not allowed here".
#
# What this does and does not do:
#
#   ZMTP is a plain TCP protocol. nginx terminates TLS here and forwards the
#   decrypted byte stream to the ZMQ PLAIN auth proxy on loopback. It never
#   parses ZMTP and never sees the PLAIN handshake, which happens end to end
#   between the client's libzmq and the auth proxy inside this tunnel.
#
#   So this layer provides confidentiality and server authentication. It does
#   NOT authenticate the client — that is the auth proxy's job, and it is the
#   only thing standing between a port scan and a live view of your deposit
#   flow. Do not expose these ports without the auth proxy behind them.
#
# One port per topic, because Core publishes one topic per port and the ports
# are not interchangeable. 28334 is rawtx, 28333 is hashblock.

# ── rawtx ─────────────────────────────────────────────────────────────────────
server {
    listen 28334 ssl;
    listen [::]:28334 ssl;

    ssl_certificate     /etc/letsencrypt/live/zmq.example.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmq.example.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ZMQ:10m;
    ssl_session_timeout 1h;

    # The ZMQ PLAIN auth proxy for rawtx. Loopback only: this port must never
    # be reachable from outside the host, or the TLS layer above is decoration.
    proxy_pass 127.0.0.1:39034;

    # A subscriber holds one connection open for the life of the process and
    # sends nothing on it. nginx's 10-minute default counts silence as death
    # and closes the connection; libzmq reconnects, so the symptom is not an
    # outage but a periodic reconnect that loses whatever was published during
    # it. An hour is longer than any gap between blocks.
    proxy_timeout          1h;
    proxy_connect_timeout  10s;

    # Transactions arrive in bursts. Nagle would batch them into the latency
    # this whole path exists to avoid.
    tcp_nodelay on;

    # Optional but recommended: if the set of consumers is known and fixed,
    # say so. ZMQ PLAIN is a password, and a password is one leak from being
    # everyone's.
    # allow 203.0.113.10;
    # deny  all;

    access_log /var/log/nginx/zmq-rawtx.log basic;
    error_log  /var/log/nginx/zmq-error.log warn;
}

# ── hashblock ─────────────────────────────────────────────────────────────────
server {
    listen 28333 ssl;
    listen [::]:28333 ssl;

    ssl_certificate     /etc/letsencrypt/live/zmq.example.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmq.example.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ZMQ:10m;
    ssl_session_timeout 1h;

    proxy_pass 127.0.0.1:39033;

    # Litecoin blocks average 2.5 minutes, comfortably inside the 10-minute
    # default — but "comfortably" is doing a lot of work during a difficulty
    # swing, and a dropped hashblock connection means confirmations stop
    # advancing until libzmq notices.
    proxy_timeout          1h;
    proxy_connect_timeout  10s;

    tcp_nodelay on;

    # allow 203.0.113.10;
    # deny  all;

    access_log /var/log/nginx/zmq-hashblock.log basic;
    error_log  /var/log/nginx/zmq-error.log warn;
}
